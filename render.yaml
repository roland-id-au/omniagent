# Render blueprint: one combined OmniAgent + OmniRoute free web service.
# Defaults to built-in `accounts` auth (multi-user, no IdP). Full walkthrough:
# deploy/render/README.md.

services:
  - type: web
    name: ds-oa-omni-7k4m2q9v
    runtime: docker
    dockerfilePath: deploy/render/Dockerfile.combined
    dockerContext: .
    plan: free
    domains:
      - omniroute.drksci.com
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        value: sqlite:////data/omnigent.db
      - key: ARTIFACT_DIR
        value: /data/artifacts
      - key: OMNIGENT_ADMIN_CREDENTIALS_PATH
        value: /data/admin-credentials
      - key: OMNIGENT_ACCOUNTS_BASE_URL
        value: https://omniroute.drksci.com
      - key: OMNIGENT_AUTH_PROVIDER
        value: accounts
      - key: OMNIGENT_ACCOUNTS_AUTO_OPEN
        value: "0"
      - key: OMNIGENT_ACCOUNTS_INIT_ADMIN_PASSWORD
        sync: false
      - key: OMNIROUTE_API_KEY
        sync: false
      - key: CHEAPERINFERENCE_API_KEY
        sync: false
      - key: REQUIRE_API_KEY
        value: "true"
      - key: AUTH_COOKIE_SECURE
        value: "true"
      - key: JWT_SECRET
        sync: false
      - key: API_KEY_SECRET
        sync: false
      - key: INITIAL_PASSWORD
        sync: false
      - key: PRICING_SYNC_ENABLED
        value: "true"
      - key: PRICING_SYNC_INTERVAL
        value: "21600"
      - key: PRICING_SYNC_SOURCES
        value: litellm
      - key: MODELS_DEV_SYNC_ENABLED
        value: "true"
      - key: MODELS_DEV_SYNC_INTERVAL
        value: "21600"
      - key: MODELS_CATALOG_PREFIX_MODE
        value: dual
      # Optional S3-compatible snapshot storage (Cloudflare R2 works here).
      - key: STATE_BACKUP_S3_ENDPOINT
        sync: false
      - key: STATE_BACKUP_S3_BUCKET
        sync: false
      - key: STATE_BACKUP_S3_KEY
        value: omnigent/omnigent.db
      - key: STATE_BACKUP_S3_REGION
        value: auto
      - key: STATE_BACKUP_ACCESS_KEY_ID
        sync: false
      - key: STATE_BACKUP_SECRET_ACCESS_KEY
        sync: false
      - key: STATE_BACKUP_INTERVAL_SEC
        value: "300"
